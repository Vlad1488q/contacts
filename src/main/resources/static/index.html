<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Довідник контактів</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #222636;
    --border:    #2e3348;
    --accent:    #5b6ef5;
    --accent-h:  #7385f8;
    --danger:    #e05252;
    --success:   #3dba7f;
    --warn:      #f0a04b;
    --text:      #e8eaf6;
    --text2:     #8b90b0;
    --text3:     #555a7a;
    --radius:    10px;
    --radius-sm: 6px;
    --font:      'Segoe UI', system-ui, sans-serif;
    --mono:      'Consolas', 'Courier New', monospace;
    --shadow:    0 4px 24px rgba(0,0,0,.45);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow);
  }

  .auth-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .auth-logo svg { color: var(--accent); }

  .auth-logo-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.3px;
  }

  .auth-tabs {
    display: flex;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 3px;
    margin-bottom: 28px;
    gap: 3px;
  }

  .auth-tab {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }

  .auth-tab.active {
    background: var(--surface2);
    color: var(--text);
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 6px;
  }

  .form-group { margin-bottom: 18px; }

  .input {
    width: 100%;
    padding: 10px 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    transition: border-color .2s;
  }

  .input:focus { border-color: var(--accent); }
  .input::placeholder { color: var(--text3); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    font-family: var(--font);
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
    padding: 11px;
    font-size: 14px;
    margin-top: 4px;
  }

  .btn-primary:hover { background: var(--accent-h); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: rgba(224,82,82,.12);
    color: var(--danger);
    border: 1px solid rgba(224,82,82,.25);
  }

  .btn-danger:hover { background: rgba(224,82,82,.22); }

  .btn-success {
    background: rgba(61,186,127,.12);
    color: var(--success);
    border: 1px solid rgba(61,186,127,.25);
  }

  .btn-success:hover { background: rgba(61,186,127,.22); }

  .btn-sm { padding: 6px 12px; font-size: 12px; }

  .auth-error {
    background: rgba(224,82,82,.12);
    border: 1px solid rgba(224,82,82,.3);
    border-radius: var(--radius-sm);
    color: var(--danger);
    padding: 10px 13px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  /* ── APP SHELL ── */
  #app-screen { display: none; min-height: 100vh; flex-direction: column; }

  .topbar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    flex-shrink: 0;
  }

  .topbar-logo svg { color: var(--accent); }

  .topbar-spacer { flex: 1; }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 13px 5px 8px;
    font-size: 13px;
    color: var(--text2);
  }

  .user-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .btn-logout {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text3);
    font-size: 12px;
    cursor: pointer;
    transition: all .18s;
    font-family: var(--font);
  }

  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  .main {
    flex: 1;
    padding: 28px 24px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── STATS ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .stat-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stat-icon.blue  { background: rgba(91,110,245,.15); color: var(--accent); }
  .stat-icon.green { background: rgba(61,186,127,.15); color: var(--success); }
  .stat-icon.warn  { background: rgba(240,160,75,.15); color: var(--warn); }

  .stat-val  { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-lbl  { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .search-wrap {
    flex: 1;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 9px 13px 9px 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
    font-family: var(--font);
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  .btn-new {
    background: var(--accent);
    color: #fff;
    padding: 9px 18px;
    flex-shrink: 0;
  }

  .btn-new:hover { background: var(--accent-h); }

  /* ── CONTACTS GRID ── */
  .contacts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }

  .contact-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    transition: border-color .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }

  .contact-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity .2s;
  }

  .contact-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .contact-card:hover::before { opacity: 1; }

  .contact-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }

  .contact-avatar {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .contact-name { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .contact-city { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .contact-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
  }

  .contact-field svg { color: var(--text3); flex-shrink: 0; }
  .contact-field span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .contact-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  /* ── EMPTY STATE ── */
  .empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    color: var(--text3);
    text-align: center;
    gap: 12px;
  }

  .empty svg { color: var(--border); }
  .empty-title { font-size: 16px; color: var(--text2); font-weight: 600; }
  .empty-sub { font-size: 13px; }

  /* ── MODAL ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 460px;
    box-shadow: var(--shadow);
    animation: slideUp .22s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(16px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .modal-title { font-size: 17px; font-weight: 700; }

  .modal-close {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    color: var(--text3);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all .15s;
    font-size: 18px;
  }

  .modal-close:hover { background: var(--surface2); color: var(--text); }

  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }

  .modal-grid .span2 { grid-column: 1 / -1; }

  .field-error {
    font-size: 11px;
    color: var(--danger);
    margin-top: 4px;
    display: none;
  }

  .input.err { border-color: var(--danger); }

  .modal-footer {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    justify-content: flex-end;
  }

  /* ── TOAST ── */
  .toasts {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 400;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 16px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--shadow);
    animation: toastIn .22s ease;
    pointer-events: all;
    max-width: 320px;
  }

  .toast.ok     { border-left: 3px solid var(--success); }
  .toast.err    { border-left: 3px solid var(--danger); }
  .toast.info   { border-left: 3px solid var(--accent); }

  @keyframes toastIn {
    from { transform: translateX(20px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  /* ── CONFIRM DIALOG ── */
  .confirm-modal {
    max-width: 360px;
    text-align: center;
  }

  .confirm-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(224,82,82,.12);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    color: var(--danger);
  }

  .confirm-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .confirm-sub   { font-size: 13px; color: var(--text2); margin-bottom: 24px; }

  /* ── TOKEN BADGE ── */
  .token-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(91,110,245,.12);
    border: 1px solid rgba(91,110,245,.25);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--accent);
    font-family: var(--mono);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── LOADING ── */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── SECTION HEADER ── */
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
  }

  .count-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 9px;
    font-size: 12px;
    color: var(--text2);
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     AUTH SCREEN
═══════════════════════════════════════════ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="auth-logo-text">Довідник контактів</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login"  onclick="switchTab('login')">Увійти</button>
      <button class="auth-tab"        id="tab-reg"    onclick="switchTab('register')">Реєстрація</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- LOGIN FORM -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label">Логін</label>
        <input id="login-username" class="input" type="text" placeholder="Введіть логін" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input id="login-password" class="input" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" onclick="doLogin()" id="btn-login">Увійти</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label class="form-label">Логін</label>
        <input id="reg-username" class="input" type="text" placeholder="Оберіть логін" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input id="reg-password" class="input" type="password" placeholder="Мін. 6 символів" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" onclick="doRegister()" id="btn-reg">Створити акаунт</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     APP SCREEN
═══════════════════════════════════════════ -->
<div id="app-screen">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Довідник контактів
    </div>
    <div class="topbar-spacer"></div>
    <div id="token-display"></div>
    <div class="user-chip">
      <div class="user-avatar" id="user-avatar">?</div>
      <span id="user-name-display">—</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Вийти</button>
  </header>

  <main class="main">

    <!-- STATS -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-icon blue">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Контактів</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div><div class="stat-val" id="stat-cities">—</div><div class="stat-lbl">Міст</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon warn">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <div><div class="stat-val" id="stat-emails">—</div><div class="stat-lbl">З email</div></div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="section-head">
      <span class="section-title">Контакти</span>
      <span class="count-badge" id="count-badge">0</span>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" id="search-input" type="text"
               placeholder="Пошук за ім'ям або телефоном…"
               oninput="filterContacts()">
      </div>
      <button class="btn btn-new" onclick="openModal()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Новий контакт
      </button>
    </div>

    <!-- CONTACTS GRID -->
    <div class="contacts-grid" id="contacts-grid">
      <div class="empty">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
        </svg>
        <div class="empty-title">Контактів ще немає</div>
        <div class="empty-sub">Натисніть «Новий контакт» щоб додати першого</div>
      </div>
    </div>

  </main>
</div>

<!-- ══════════════════════════════════════════
     CONTACT MODAL
═══════════════════════════════════════════ -->
<div class="overlay" id="contact-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Новий контакт</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="modal-grid">
      <div>
        <label class="form-label">Ім'я *</label>
        <input id="f-firstName" class="input" placeholder="Іван">
        <div class="field-error" id="err-firstName"></div>
      </div>
      <div>
        <label class="form-label">Прізвище *</label>
        <input id="f-lastName" class="input" placeholder="Петренко">
        <div class="field-error" id="err-lastName"></div>
      </div>
      <div class="span2">
        <label class="form-label">Телефон *</label>
        <input id="f-phone" class="input" placeholder="+380991234567">
        <div class="field-error" id="err-phone"></div>
      </div>
      <div class="span2">
        <label class="form-label">Email</label>
        <input id="f-email" class="input" type="email" placeholder="ivan@gmail.com">
        <div class="field-error" id="err-email"></div>
      </div>
      <div>
        <label class="form-label">Адреса</label>
        <input id="f-address" class="input" placeholder="вул. Хрещатик 1">
      </div>
      <div>
        <label class="form-label">Місто</label>
        <input id="f-city" class="input" placeholder="Київ">
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Скасувати</button>
      <button class="btn btn-primary" style="width:auto;padding:10px 24px" id="btn-save" onclick="saveContact()">Зберегти</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     CONFIRM DELETE MODAL
═══════════════════════════════════════════ -->
<div class="overlay" id="confirm-overlay">
  <div class="modal confirm-modal">
    <div class="confirm-icon">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
    </div>
    <div class="confirm-title">Видалити контакт?</div>
    <div class="confirm-sub" id="confirm-sub">Цю дію неможливо скасувати.</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-ghost" onclick="closeConfirm()">Скасувати</button>
      <button class="btn btn-danger" onclick="confirmDelete()" id="btn-confirm-del">Видалити</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toasts" id="toasts"></div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const API = 'http://localhost:8080';
let jwtToken   = localStorage.getItem('jwt') || null;
let currentUser= localStorage.getItem('username') || null;
let contacts   = [];
let editingId  = null;
let deletingId = null;

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  if (jwtToken) {
    showApp();
    loadContacts();
  }
  // Enter key on auth forms
  document.querySelectorAll('#form-login .input').forEach(el =>
    el.addEventListener('keydown', e => e.key === 'Enter' && doLogin()));
  document.querySelectorAll('#form-register .input').forEach(el =>
    el.addEventListener('keydown', e => e.key === 'Enter' && doRegister()));
});

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active',  isLogin);
  document.getElementById('tab-reg').classList.toggle('active',   !isLogin);
  document.getElementById('form-login').style.display    = isLogin ? '' : 'none';
  document.getElementById('form-register').style.display = isLogin ? 'none' : '';
  hideAuthError();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAuthError() { document.getElementById('auth-error').style.display = 'none'; }

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if (!username || !password) { showAuthError('Заповніть усі поля'); return; }

  const btn = document.getElementById('btn-login');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;
  hideAuthError();

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Невірний логін або пароль');
    }
    const data = await res.json();
    saveToken(data.token, data.username);
    showApp();
    loadContacts();
  } catch(e) {
    showAuthError(e.message);
  } finally {
    btn.textContent = 'Увійти';
    btn.disabled = false;
  }
}

async function doRegister() {
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!username) { showAuthError('Введіть логін'); return; }
  if (password.length < 6) { showAuthError('Пароль мінімум 6 символів'); return; }

  const btn = document.getElementById('btn-reg');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;
  hideAuthError();

  try {
    const res = await fetch(`${API}/api/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Помилка реєстрації');
    }
    const data = await res.json();
    saveToken(data.token, data.username);
    showApp();
    loadContacts();
    toast('Акаунт створено!', 'ok');
  } catch(e) {
    showAuthError(e.message);
  } finally {
    btn.textContent = 'Створити акаунт';
    btn.disabled = false;
  }
}

function saveToken(token, username) {
  jwtToken    = token;
  currentUser = username;
  localStorage.setItem('jwt', token);
  localStorage.setItem('username', username);
}

function doLogout() {
  localStorage.removeItem('jwt');
  localStorage.removeItem('username');
  jwtToken = null; currentUser = null; contacts = [];
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  switchTab('login');
  toast('Ви вийшли з акаунту', 'info');
}

// ══════════════════════════════════════════
// SHOW APP
// ══════════════════════════════════════════
function showApp() {
  document.getElementById('auth-screen').style.display  = 'none';
  document.getElementById('app-screen').style.display   = 'flex';

  // user chip
  const name = currentUser || '?';
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();

  // token badge
  if (jwtToken) {
    const short = jwtToken.substring(0,20) + '…';
    document.getElementById('token-display').innerHTML =
      `<div class="token-badge" title="${jwtToken}">JWT: ${short}</div>`;
  }
}

// ══════════════════════════════════════════
// API HELPER
// ══════════════════════════════════════════
async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${jwtToken}`,
      ...opts.headers
    }
  });
  if (res.status === 401) {
    toast('Сесія закінчилась — увійдіть знову', 'err');
    doLogout(); return null;
  }
  return res;
}

// ══════════════════════════════════════════
// CONTACTS
// ══════════════════════════════════════════
async function loadContacts() {
  try {
    const res = await apiFetch('/api/contacts');
    if (!res) return;
    contacts = await res.json();
    renderContacts(contacts);
    updateStats(contacts);
  } catch(e) {
    toast('Не вдалося завантажити контакти', 'err');
  }
}

function renderContacts(list) {
  const grid = document.getElementById('contacts-grid');
  document.getElementById('count-badge').textContent = list.length;

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
        </svg>
        <div class="empty-title">Нічого не знайдено</div>
        <div class="empty-sub">Спробуйте інший пошук або додайте новий контакт</div>
      </div>`;
    return;
  }

  grid.innerHTML = list.map(c => {
    const initials = ((c.firstName||'?').charAt(0) + (c.lastName||'?').charAt(0)).toUpperCase();
    return `
    <div class="contact-card" id="card-${c.id}">
      <div class="contact-header">
        <div class="contact-avatar">${initials}</div>
        <div>
          <div class="contact-name">${esc(c.firstName)} ${esc(c.lastName)}</div>
          ${c.city ? `<div class="contact-city">📍 ${esc(c.city)}</div>` : ''}
        </div>
      </div>
      <div class="contact-field">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.38 2 2 0 0 1 3.6 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.78a16 16 0 0 0 6.08 6.08l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.79 16.92z"/>
        </svg>
        <span>${esc(c.phone)}</span>
      </div>
      ${c.email ? `
      <div class="contact-field">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
        </svg>
        <span>${esc(c.email)}</span>
      </div>` : ''}
      ${c.address ? `
      <div class="contact-field">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>${esc(c.address)}</span>
      </div>` : ''}
      <div class="contact-actions">
        <button class="btn btn-success btn-sm" onclick="openModal(${c.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Редагувати
        </button>
        <button class="btn btn-danger btn-sm" onclick="openConfirm(${c.id}, '${esc(c.firstName)} ${esc(c.lastName)}')">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          </svg>
          Видалити
        </button>
      </div>
    </div>`;
  }).join('');
}

function updateStats(list) {
  document.getElementById('stat-total').textContent  = list.length;
  const cities = new Set(list.map(c => c.city).filter(Boolean));
  document.getElementById('stat-cities').textContent = cities.size;
  document.getElementById('stat-emails').textContent = list.filter(c => c.email).length;
}

function filterContacts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = contacts.filter(c =>
    `${c.firstName} ${c.lastName} ${c.phone} ${c.city || ''}`.toLowerCase().includes(q));
  renderContacts(filtered);
}

// ══════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════
function openModal(id = null) {
  editingId = id;
  clearModalErrors();

  if (id) {
    const c = contacts.find(x => x.id === id);
    document.getElementById('modal-title').textContent = 'Редагувати контакт';
    document.getElementById('f-firstName').value = c.firstName || '';
    document.getElementById('f-lastName').value  = c.lastName  || '';
    document.getElementById('f-phone').value     = c.phone     || '';
    document.getElementById('f-email').value     = c.email     || '';
    document.getElementById('f-address').value   = c.address   || '';
    document.getElementById('f-city').value      = c.city      || '';
  } else {
    document.getElementById('modal-title').textContent = 'Новий контакт';
    ['firstName','lastName','phone','email','address','city'].forEach(f =>
      document.getElementById(`f-${f}`).value = '');
  }

  document.getElementById('contact-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-firstName').focus(), 50);
}

function closeModal() {
  document.getElementById('contact-overlay').classList.remove('open');
  editingId = null;
}

function clearModalErrors() {
  ['firstName','lastName','phone','email'].forEach(f => {
    const inp = document.getElementById(`f-${f}`);
    const err = document.getElementById(`err-${f}`);
    inp.classList.remove('err');
    err.style.display = 'none';
    err.textContent = '';
  });
}

function showFieldError(field, msg) {
  const inp = document.getElementById(`f-${field}`);
  const err = document.getElementById(`err-${field}`);
  inp.classList.add('err');
  err.textContent = msg;
  err.style.display = 'block';
}

async function saveContact() {
  clearModalErrors();
  const body = {
    firstName: document.getElementById('f-firstName').value.trim(),
    lastName:  document.getElementById('f-lastName').value.trim(),
    phone:     document.getElementById('f-phone').value.trim(),
    email:     document.getElementById('f-email').value.trim() || null,
    address:   document.getElementById('f-address').value.trim() || null,
    city:      document.getElementById('f-city').value.trim() || null,
  };

  const btn = document.getElementById('btn-save');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  try {
    const url    = editingId ? `/api/contacts/${editingId}` : '/api/contacts';
    const method = editingId ? 'PUT' : 'POST';
    const res = await apiFetch(url, { method, body: JSON.stringify(body) });
    if (!res) return;

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      // Field-level validation errors from Spring
      if (res.status === 400 && typeof data === 'object') {
        let hasField = false;
        ['firstName','lastName','phone','email'].forEach(f => {
          if (data[f]) { showFieldError(f, data[f]); hasField = true; }
        });
        if (!hasField) toast(data.error || 'Помилка збереження', 'err');
        return;
      }
      throw new Error(data.error || 'Помилка сервера');
    }

    closeModal();
    await loadContacts();
    toast(editingId ? 'Контакт оновлено ✓' : 'Контакт додано ✓', 'ok');
  } catch(e) {
    toast(e.message, 'err');
  } finally {
    btn.textContent = 'Зберегти';
    btn.disabled = false;
  }
}

// ══════════════════════════════════════════
// DELETE CONFIRM
// ══════════════════════════════════════════
function openConfirm(id, name) {
  deletingId = id;
  document.getElementById('confirm-sub').textContent =
    `Контакт "${name}" буде видалено. Цю дію неможливо скасувати.`;
  document.getElementById('confirm-overlay').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
  deletingId = null;
}

async function confirmDelete() {
  if (!deletingId) return;
  const btn = document.getElementById('btn-confirm-del');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  try {
    const res = await apiFetch(`/api/contacts/${deletingId}`, { method: 'DELETE' });
    if (!res) return;
    closeConfirm();
    await loadContacts();
    toast('Контакт видалено', 'ok');
  } catch(e) {
    toast('Не вдалося видалити', 'err');
  } finally {
    btn.textContent = 'Видалити';
    btn.disabled = false;
  }
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function toast(msg, type = 'info') {
  const icons = { ok: '✓', err: '✕', info: 'ℹ' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close modals on overlay click
document.getElementById('contact-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.getElementById('confirm-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeConfirm();
});

// Enter key in modal
document.querySelectorAll('#contact-overlay .input').forEach(el =>
  el.addEventListener('keydown', e => e.key === 'Enter' && saveContact()));
</script>
</body>
</html>
